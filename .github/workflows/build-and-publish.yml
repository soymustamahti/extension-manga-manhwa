name: Build and publish extension repo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The runner image already ships the Android SDK; android-actions/setup-android
      # still calls `sdkmanager tools`, which no longer exists.
      - name: Set up Android SDK
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | tail -n 1)"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Build APKs
        run: |
          ./gradlew --no-daemon \
            :src:es:manhwaweb:assembleRelease \
            :src:es:olympusscanlation:assembleRelease \
            :src:es:zonatmonet:assembleRelease

      # The index is built from each module's keiyoushi-source-info.json; the
      # extensions-inspector still rejects anything above extension lib 1.4.
      - name: Prepare repo files
        run: python3 scripts/create-extension-repo.py

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: extensions
          path: repo/

      - name: Publish repo branch
        run: |
          rm -rf /tmp/extension-repo
          mkdir -p /tmp/extension-repo
          cp -R repo/. /tmp/extension-repo/
          git fetch origin repo || true
          # `git switch` never treats the name as a pathspec, unlike `git checkout`,
          # which is ambiguous here because the build leaves a ./repo directory behind.
          if git show-ref --verify --quiet refs/remotes/origin/repo; then
            git switch -C repo origin/repo
          else
            git switch --orphan repo
          fi
          rm -rf apk icon index.json index.min.json index.html repo.json
          cp -R /tmp/extension-repo/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A apk icon index.json index.min.json index.html repo.json
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Update extension repo"
            git push origin repo
          fi
